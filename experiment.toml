# Single source of truth for benchmark parameters. Recorded verbatim in every run manifest.
seed = 20261020          # run-order randomization seed (payload seed lives in gen_payloads.py)
cooldown_s = 3           # idle time between runs
client_cpu_limit = 8.0   # must match compose.yaml k6.cpus
api_cpu_limit = 2.0      # must match compose.yaml api-*.cpus
client_saturation_threshold = 0.85   # flag runs where k6 CPU > 85% of its limit
require_ac_power = true  # abort before any run if the host is on battery (macOS pmset)

# R1 (approved 2026-10-20 after the pilot): recreate both API containers before every run,
# wait for health + a TLS 1.3 readiness probe, then record an idle resource baseline before
# k6 starts. k6 still runs its own warm-up. The pilot (2026-10-20) ran without this.
restart_per_run = true
idle_baseline_s = 2

# R6 (approved 2026-10-20): deterministic systematic sample of individual measured requests.
# A request is sampled when its global iteration index is divisible by K. K is odd (coprime
# with the 4-item payload pool) and sized from pilot throughput so a 60 s run yields roughly
# 3,000-15,000 samples. `cap` is a hard bound per run; truncation is recorded in runs.csv.
[sampling]
every = { "1k" = 101, "16k" = 25, "256k" = 3 }
cap = 50000

[profiles.smoke]
modes = ["plain", "aead"]
sizes = ["1k", "16k", "256k"]
vus = [1, 8]
reps = 1
warmup_s = 2
duration_s = 5
smoke = true             # k6 thresholds fail the run on any error/integrity failure

[profiles.pilot]         # executed 2026-10-20 (results/raw/20261020T154305Z-pilot), before R1/R6
modes = ["plain", "aead"]
sizes = ["1k", "16k", "256k"]
vus = [1, 64]
reps = 2
warmup_s = 5
duration_s = 20
smoke = false

# Validation of the revised pipeline (R1, R6) on a reduced closed-loop matrix.
[profiles.validate-closed]
modes = ["plain", "aead"]
sizes = ["1k", "16k", "256k"]
vus = [1, 64]
reps = 2
warmup_s = 5
duration_s = 15
smoke = false

# Primary experiment: closed loop, 2 x 3 x 3 x 5 = 90 runs. Requires --allow-full.
[profiles.full]
gated = true
modes = ["plain", "aead"]
sizes = ["1k", "16k", "256k"]
vus = [1, 16, 64]
reps = 5
warmup_s = 10
duration_s = 60
smoke = false

# R3 (approved 2026-10-20 as a SEPARATE experiment, never pooled with the 90-run matrix):
# open-loop fixed arrival rate. Rates are about 50% of the LOWER of the two configurations'
# pilot capacity (aead, 64 VUs: 14,946 / 3,880 / 294 req/s), rounded down, so both
# configurations are below capacity. `vus` is the pre-allocated VU pool, not concurrency.
# Any dropped iteration fails the run (k6 exit 99).
[profiles.validate-open]
executor = "constant-arrival-rate"
modes = ["plain", "aead"]
sizes = ["1k", "16k", "256k"]
rates = { "1k" = 7000, "16k" = 1900, "256k" = 140 }
vus = [64]
# Approved 2026-10-20 after the first open-loop validation (20261020T185653Z-validate-open), in
# which 3 of 4 runs at 1k / 7,000 req/s dropped 106-113 iterations at start-up ("Insufficient
# VUs, reached 64") although the measured rate was on target. The 1k pool is doubled, and the
# 1k sample interval is reduced so the open-loop 1k sample is about 4,000 requests, not 1,040.
# Revised again 2026-10-20 (approved) after the second open-loop validation
# (20261020T221439Z-validate-open) and two diagnostic runs: (1) each run is split into a
# ramped `warmup` scenario and a constant-rate `measure` scenario (see k6/bench.js), which
# removed the start-up drops; (2) the remaining drops came from transient stalls of the whole
# Docker VM (~40 ms; requests took 39 ms while the server spent 0.05 ms in the handler). The
# pool is therefore sized to absorb a 100 ms stall: max(64, ceil(rate x 0.1 s)). Idle pool VUs
# hold no connection; in normal operation about 5 VUs are busy at 7,000 req/s.
pool = { "1k" = 700, "16k" = 190, "256k" = 64 }
# K must be coprime with the pool as well as with the 4-item payload pool: arrival-rate VUs are
# reused in rotation, so K = 25 with a 190-VU pool sampled only one VU in five and biased the
# sample p50 by 8-11% in 20261020T224521Z-validate-open. 23 is prime and divides no pool size.
sample_every = { "1k" = 23, "16k" = 23, "256k" = 3 }
reps = 2
warmup_s = 5
duration_s = 15
smoke = false

[profiles.openloop]
gated = true
executor = "constant-arrival-rate"
modes = ["plain", "aead"]
sizes = ["1k", "16k", "256k"]
rates = { "1k" = 7000, "16k" = 1900, "256k" = 140 }
vus = [64]
pool = { "1k" = 700, "16k" = 190, "256k" = 64 }   # as validate-open
sample_every = { "1k" = 23, "16k" = 23, "256k" = 3 }
reps = 5
warmup_s = 10
duration_s = 60
smoke = false

# Experiment C (H5, LLM inference), pre-registered in docs/research-design.md §7 and approved
# by the owner on 2026-10-21. Run with scripts/run_infer.py (not run_matrix.py). One VU sends
# requests alternately to both API services; every measured request is logged.
[inference]
ollama_host_url = "http://127.0.0.1:11434"   # host-side checks; the API uses compose OLLAMA_URL
ollama_version = "0.35.0"                     # checked before every run; abort if changed
model = "qwen3:8b"
model_digest = "500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41"
lengths = { short = 32, long = 256 }          # num_predict per response-length level
warmup_n = 8                                  # one full 8-request order cycle, discarded
load_duration_max_ms = 100                    # acceptance: model stayed resident
determinism_repeats = 5

[profiles.infer-smoke]     # pipeline check of run_infer.py and analysis/h5.py; not H5 data
executor = "infer"
lengths = ["short", "long"]
reps = 1
measure_n = 8
gpu_sampling = true

[profiles.infer-pilot]
executor = "infer"
lengths = ["short", "long"]
reps = 3
measure_n = 32           # 16 per mode
gpu_sampling = true      # ioreg counters, pilot only unless approved for the full run

[profiles.infer]
gated = true             # requires --allow-full (owner gate G7, after the pilot report)
executor = "infer"
lengths = ["short", "long"]
reps = 5
measure_n = 48           # 24 per mode
gpu_sampling = true      # G7b approved 2026-10-21 (modes interleaved, so equal cost)
