[project]
name = "aead-tls13-study"
version = "0.1.0"
description = "Controlled study of AES-256-GCM application-layer encryption over TLS 1.3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
analysis = [
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev", "analysis"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]
"analysis/*" = ["E501"]  # Markdown table literals
